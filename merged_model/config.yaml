datasets:
  ulsan:
    path: data/raw/ulsan_temporal_grid.npy
    # cp949 인코딩, 기온/강수량/적설 컬럼 필요. mm_data/ 쪽 CSV는 ulsan에 적설이 없어 쓰면 안 된다.
    weather_path: data/raw/ulsan_meteorological_data.csv
  porto:
    path: data/raw/porto_temporal_grid.npy
    weather_path: data/raw/porto_meteorological_data.csv

data:
  time_step: 24
  daily_period: 24
  daily_lags: 6
  weekly_period: 168
  weekly_lags: 4
  lag_radius: 0
  train_ratio: 0.80
  val_ratio: 0.10

model:
  local_radius: 2
  d_model: 64
  num_fourier_bands: 8
  transformer_layers: 2
  transformer_heads: 4
  transformer_ffn: 128
  history_hidden: 64
  periodic_hidden: 64
  fusion_dim: 128
  dropout: 0.10
  retrieval_k: 20
  retrieval_chunk_size: 256
  # 요일/시간대 임베딩 차원. 날씨는 임베딩하지 않고 정규화한 3값을 그대로 concat하므로,
  # 세 LSTM에 붙는 보조 텐서는 3 + weekday_dim + hour_dim = 15차원이 된다.
  weekday_dim: 7
  hour_dim: 5

training:
  seed: 2026
  batch_size: 8
  num_workers: 0
  lr: 0.001
  weight_decay: 0.0001
  epochs: 2000
  patience: 20
  retrieval_scope: observed_past
