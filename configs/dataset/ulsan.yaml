city: ulsan
npy_path: data/raw/ulsan_temporal_grid.npy
weather_csv_path: data/raw/ulsan_meteorological_data.csv
time_step: 8
# 시간순 분할이며 남은 구간은 test다.
train_ratio: 0.7
val_ratio: 0.15
# 시간 인덱스 0의 시각과 데이터 기간(2024-10-01 ~ 2025-03-31)의 공휴일. data.context_features의
# holiday가 쓴다. 2025-01-27은 정부가 2025-01-14 국무회의에서 지정한 임시공휴일(설 연휴 전날)이다.
start_time: '2024-10-01 00:00'
holidays: ['2024-10-03', '2024-10-09', '2024-12-25', '2025-01-01', '2025-01-27', '2025-01-28',
           '2025-01-29', '2025-01-30', '2025-03-01', '2025-03-03']
