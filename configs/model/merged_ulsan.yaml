# MergedDemandConfig 하이퍼파라미터 — Ulsan 채택 설정.
# height/width/time_step/retrieval_grid_path/retrieval_train_end/weather_mean/weather_std는
# 데이터에서 파생되므로 train.py가 채운다.
#
# 기존 d_model=64 튜닝 기록: output/merged/runs/tune_ulsan_*_seed245.json.
# 같은 Ulsan 설정에서 d_model=16 Transformer로 바꾼 seed 245 비교는
# RMSE 0.731112 -> 0.724449, MAE 0.320971 -> 0.320882로 개선되고
# MAPE(+1) 15.111426 -> 15.505391로 악화했다. 단일 seed 결과다.
# 원자료: output/experiments/var_d{64,16}_transformer_seed245.json.
local_radius: 2
d_model: 16
local_encoder: transformer
# MA 채택: 노드별 daily/weekly 평균 게이트 + local 선형항이 직접 예측한다.
# seed 245에서 local-only 대비 RMSE 0.724449 -> 0.722502, MAPE(+1)
# 15.505391 -> 15.311199로 개선, MAE 0.320882 -> 0.322443으로 악화.
# 단일 seed 결과다. 이전 local-only 비교는 model.periodic_mode=none.
periodic_mode: ma
num_fourier_bands: 8
transformer_layers: 2
transformer_heads: 4
transformer_ffn: 128
history_hidden: 64
periodic_hidden: 64
fusion_dim: 128
dropout: 0.10
# 어텐션 **가중치**에 걸리는 dropout만 따로 뗀 값. 위 dropout은 어텐션 출력 / FFN 은닉 /
# FFN 출력 세 곳에 걸리고, 이 값은 "CLS가 어떤 이웃 칸을 보는지"를 확률적으로 끊는다.
# 격자의 74%가 0이라 정보를 가진 이웃이 몇 개 없어서 그 교란이 상대적으로 크므로 기본은 0이다.
# 0이 아니면 PyTorch SDPA의 batch<=65535 제한이 살아나 train.py가 배치를 깎는다.
attention_dropout: 0.0
# --- retrieval 관점 ---
# 질의(그 노드의 최근 k시간 수요)와 코사인 유사도가 가장 높은 과거 윈도우 top-k.
num_retrieval: 20
# 검색 후보 범위. observed_past = tau < target_time(원본 기본값), train_prefix = train split까지만.
retrieval_scope: observed_past
# 후보를 몇 시점씩 끊어서 훑을지. 값이 클수록 한 번에 만드는 후보 텐서가 커진다.
retrieval_chunk_size: 256
# 요일/시간대 임베딩 차원. 날씨는 임베딩하지 않고 정규화한 3값을 그대로 concat하므로,
# 세 LSTM에 붙는 보조 텐서는 3 + weekday_dim + hour_dim = 15차원이 된다.
weekday_dim: 7
hour_dim: 5

# --- ablation 스위치 (기본값 = full, 아무것도 끄지 않은 모델) ---
# ablation은 "0-치환" 방식이다 — 모듈을 없애지 않고 항상 생성·실행한 뒤 결과 텐서만 0으로
# 바꾼다. 예외는 use_branch_attention으로, 어텐션은 출력이 아니라 선택 메커니즘이라
# 0-치환이 성립하지 않아 균등 가중으로 대체한다.
# CLI 오버라이드 예: python train.py --config-name config_ulsan model.use_retrieval=false
use_daily: true
use_weekly: true
use_retrieval: true
use_weather: true
# 'concat'(기본, 정규화 3값을 세 LSTM 입력에 붙임) | 'cls_add'(ir-weather 방식, CLS에 더함)
weather_injection: concat
use_calendar: true
use_branch_attention: true
use_neighbors: true
use_softplus: true

# --- 노드별 gated LSTM weight offset + 공유 weight FP8 ---
# temporal LSTM을 노드마다 다르게 쓴다. 적응 노드의 유효 weight는 공유 W와 노드별 ΔW의
# 볼록 결합 W_eff = s*W_shared + (1-s)*ΔW 이고, s와 ΔW 모두 학습 대상이다(s=1, ΔW=0 초기화
# -> 학습 시작 시점의 함수는 공유 LSTM과 정확히 같다). 적응 노드가 아닌 노드는 공유 W만
# 쓰면서 외부 weight를 받는 torch._VF.lstm 경로를 그대로 탄다.
#
# ulsan 3-seed(2026/245/6835) 결과로 이 조합을 기본값으로 채택했다. baseline 대비 paired
# 평균 RMSE -1.613%(3/3 seed 개선), MAE -0.855%(3/3), MAPE(0 제외) -1.722%(3/3)이다.
# 대신 MAPE(+1)은 평균 +1.456%로 악화한다(개선 1/3) — 그 지표가 주 기준이면 둘 다 꺼야 한다.
# 파라미터는 121,907 -> 1,732,660(14.21배)로 늘고, 학습된 s는 0.8410 ± 0.0074로 세 seed 모두
# 공유 W 약 84% / ΔW 약 16%에 수렴했다.
# (원자료: output/experiments/exp{1,2,3}_*_ulsan_seed{2026,245,6835}.json)
#
# 주의: zero_node_max_demand와는 노드 축이 어긋나 동시에 켤 수 없다(modeling.py가 막는다).
node_adaptive: true
# ΔW를 받을 노드: train 구간 평균 수요가 이 값을 넘는 노드만. ulsan 기준 44/168 (26.2%).
# 수요가 거의 0인 노드(ulsan 노드 중앙값 0.141)에 노드당 36,864개 파라미터를 주면
# 신호가 아니라 노이즈를 외울 용량만 늘어난다.
# 실제 노드 id 목록(node_adaptive_indices)은 train.py가 train 구간에서 계산해 주입한다.
node_adaptive_min_demand: 0.8
# 공유 temporal LSTM의 weight/bias 4개를 absmax scaling + torch.float8_e4m3fn으로 fake
# quantize한다(straight-through). ΔW와 s는 fp32로 남는다. master weight도 optimizer도
# fp32이므로 **이것은 정확도 실험이지 메모리/속도 절감이 아니다** — 실제 FP8 저장·연산을
# 원하면 별도 작업이 필요하다. node_adaptive=true 기준으로 RMSE/MAE/MAPE(0 제외)가
# 세 seed 중 둘에서 더 좋아 함께 켠다.
shared_weight_fp8: true

# 'combined'(저장소 공용 CombinedLoss, 다른 모든 브랜치와 동일한 목적함수) |
# 'mae'(merged_model이 원래 쓰던 raw 스케일 L1) |
# 'rmse_mape'(rmse_weight*RMSE + MAPE(+1)).
# train 구간 평균 수요가 이 값 이하인 노드는 학습에서 제외한다 — 예측을 정확히 0으로 고정하고
# 손실에서도 뺀다. null이면 이 기능이 없던 때와 동일하다. **평가는 항상 전체 노드로 한다**
# (평가 대상을 바꾸면 기존 결과와 비교가 성립하지 않는다).
zero_node_max_demand: null

loss_type: mae
loss_gamma: 1.0
loss_eps: 0.5
# loss_type='rmse_mape'에서만 쓰인다. 10이면 두 항이 (RMSE 0.75 -> 7.5) vs (MAPE 15.4)로
# 비슷한 크기가 된다.
rmse_weight: 10.0

# loss_type='demand_split'에서만 쓰인다. 수요가 낮은 셀과 높은 셀에 서로 다른 오차를 준다:
#   실제 수요 <= split_threshold : |오차| / (|y|+1)              <- MAPE(+1)이 보는 것
#   실제 수요 >  split_threshold : split_high_weight * 오차^2    <- RMSE가 보는 것
# rmse_mape(선형 결합)는 모든 셀이 두 항에 동시에 기여해서 "예측을 전반적으로 쪼그라뜨려
# 0셀 MAPE를 벌고 고수요 셀 RMSE를 잃는" 거래가 이득이 된다. 셀을 한 항에만 넣어 그 교차
# 압력을 없앤 것이 이 손실이다. 근거와 w 선택 기준은 models/losses.py의 DemandSplitLoss 참고.
split_threshold: 1.0
split_high_weight: 1.0
