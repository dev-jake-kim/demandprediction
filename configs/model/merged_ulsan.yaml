
# height/width/time_step/retrieval_grid_path/retrieval_train_end/temperature_min/temperature_max/precipitation_max는 train.py가 데이터에서 채운다.
local_radius: 1
d_model: 16
num_fourier_bands: 8
transformer_layers: 2
transformer_heads: 4
transformer_ffn: 128
history_hidden: 64
periodic_hidden: 64
fusion_dim: 128
dropout: 0.10

attention_dropout: 0.0
retrieval_k: 20
retrieval_chunk_size: 256
# observed_past는 target_time 이전 관측값만 후보로 삼는다.
retrieval_scope: observed_past
# 기능적 이웃: masked Transformer 수용 영역 밖에서 train 구간 상관이 가장 큰 노드 k개의 최근 수요 평균을 토큰에 더한다. 0이면 끔.
functional_neighbor_k: 0
# 기능적 이웃 선택 기준: raw(원 시계열 상관) | residual(요일×시각 평균을 뺀 잔차 상관).
functional_neighbor_mode: raw
# 날씨 특성은 임베딩 없이 3개 채널로 주입한다.
weekday_dim: 7
hour_dim: 5

# 모델 ablation 스위치.
use_daily: true
use_weekly: true
use_retrieval: false
use_weather: true
# weather_injection은 날씨 특성의 주입 위치를 선택한다.
weather_injection: concat
use_calendar: true
use_branch_attention: true
use_neighbors: true
use_sink: true
# masked_grid(채택) | crop(이전 방식, ablation 전용)
local_encoder: masked_grid
# 모든 노드가 attention으로 볼 수 있는 노드 id 목록(실험용, 기본 없음)
global_nodes: []
use_softplus: true

# node_adaptive는 stage 1에서 ΔW를 고정하고 stage 2에서 학습한다.
node_adaptive: true
node_adaptive_min_demand: 0.1
# additive: W + ΔW[n] | gated: g[n]·W + (1−g[n])·V[n] (V는 stage 2 시작 때 W로 복사)
# | basis: ΔW[n] = Σ_m c[n,m]·B[m] (공유 기저 node_delta_rank개, docs/SPEC.md §6.7)
node_adaptive_mode: additive
node_delta_rank: 8
# basis에서 c[n]에 train 구간 노드 기술자(일중·요일 모양, 수준, 0 비율, 변동계수) 투영을 더한다.
node_delta_descriptor: false
# ΔW 위치: history(최근 이력 LSTM) | periodic(일·주 주기 LSTM) | fusion(branch attention) | head(출력 head)
node_adaptive_scope: [history]


# 울산: RMSE(평균)와 MAPE(0 쪽)를 함께 맞추는 mse_mape(λ=2). Porto는 mae.
loss_type: mse_mape
loss_gamma: 1.0
loss_eps: 0.5
# rmse_weight는 loss_type='rmse_mape'에서만 사용한다.
rmse_weight: 10.0
# mape_weight는 loss_type='mse_mape'에서만 사용한다(error² + mape_weight·|error|/(y+1)).
mape_weight: 2.0

# node_mix_*는 loss_type(또는 stage2.loss)='node_mix'에서만 사용한다(docs/SPEC.md §7).
node_mix_lambda_low: 0.9
node_mix_lambda_high: 0.1
node_mix_tau: 0.5
node_mix_width: 0.5
node_mix_scaler: true

# split_*은 loss_type='demand_split'에서만 사용한다.
split_threshold: 1.0
split_high_weight: 1.0
