# Porto merged 모델 설정.
# height/width/time_step/retrieval_grid_path/retrieval_train_end/temperature_min/temperature_max/precipitation_max는 train.py가 데이터에서 채운다.

local_radius: 1
d_model: 64
num_fourier_bands: 8
transformer_layers: 2
transformer_heads: 4
transformer_ffn: 128
history_hidden: 64
periodic_hidden: 64
fusion_dim: 128
dropout: 0.10

attention_dropout: 0.0
retrieval_k: 20
retrieval_chunk_size: 256
# observed_past는 target_time 이전 관측값만 후보로 삼는다.
retrieval_scope: observed_past
# 단독 학습한 검색 encoder(encoder.pt) 절대경로. null이면 raw 창 cosine 유사도.
retrieval_encoder_path: null
# 검색 질의: local(노드별 3×3 창) | global(지도 전체 창, 고른 시점을 모든 노드가 공유).
retrieval_query: local
# 검색 결과 주입: output_gate(λ·neural + (1−λ)·ir_out) | local_concat(h_neural에 concat 후 Linear).
retrieval_injection: output_gate
# 날씨 특성은 임베딩 없이 3개 채널로 주입한다.
weekday_dim: 7
hour_dim: 5

# 모델 ablation 스위치.
use_daily: true
use_weekly: true
use_retrieval: false
use_weather: true
# weather_injection은 날씨 특성의 주입 위치를 선택한다.
weather_injection: concat
use_calendar: true
use_branch_attention: true
use_neighbors: true
use_softplus: true

# node_adaptive는 stage 1에서 ΔW를 고정하고 stage 2에서 학습한다.
node_adaptive: true
node_adaptive_min_demand: 0.1


loss_type: mae
loss_gamma: 1.0
loss_eps: 0.5
# rmse_weight는 loss_type='rmse_mape'에서만 사용한다.
rmse_weight: 10.0

# split_*은 loss_type='demand_split'에서만 사용한다.
split_threshold: 1.0
split_high_weight: 1.0
