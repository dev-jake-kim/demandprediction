# MergedDemandConfig 하이퍼파라미터 — porto.
# height/width/time_step/retrieval_grid_path/retrieval_train_end/weather_mean/weather_std는
# 데이터에서 파생되므로 train.py가 채운다.
#
# **history_hidden은 128이었다가 64로 되돌렸다.** 128은 2026-09-10-11 튜닝 스윕에서
# 채택한 값인데, 그 스윕이 잘못된 격자(19x20=380노드)로 돌아간 것이라 무효다.
# porto의 정본 격자는 10x20=200노드이고(preprocessing/porto/create_graph.py가 생성,
# landuse_grid.npy와 같은 shape), 그 격자로 돌았던 포팅 전 merged_model은 history_hidden=64를
# 썼다. 근거가 사라진 128 대신 그 값으로 되돌린다 — porto 튜닝 스윕은 재실행이 필요하다.
local_radius: 2
d_model: 64
num_fourier_bands: 8
transformer_layers: 2
transformer_heads: 4
transformer_ffn: 128
history_hidden: 64
periodic_hidden: 64
fusion_dim: 128
dropout: 0.10
# 어텐션 **가중치**에 걸리는 dropout만 따로 뗀 값. 위 dropout은 어텐션 출력 / FFN 은닉 /
# FFN 출력 세 곳에 걸리고, 이 값은 "CLS가 어떤 이웃 칸을 보는지"를 확률적으로 끊는다.
# 격자의 74%가 0이라 정보를 가진 이웃이 몇 개 없어서 그 교란이 상대적으로 크므로 기본은 0이다.
# 0이 아니면 PyTorch SDPA의 batch<=65535 제한이 살아나 train.py가 배치를 깎는다.
attention_dropout: 0.0
# --- retrieval 관점 ---
# 질의(그 노드의 최근 k시간 수요)와 코사인 유사도가 가장 높은 과거 윈도우 top-k.
num_retrieval: 20
# 검색 후보 범위. observed_past = tau < target_time(원본 기본값), train_prefix = train split까지만.
retrieval_scope: observed_past
# 답안지(윈도우 직후 수요) 임베딩 테이블 상한. 인덱스는 min(max_table, round(수요))라
# 이 값 이상은 한 칸으로 합쳐진다. 테이블 크기는 max_table + 1이다.
retrieval_max_table: 10
# 요일/시간대 임베딩 차원. 날씨는 임베딩하지 않고 정규화한 3값을 그대로 concat하므로,
# 세 LSTM에 붙는 보조 텐서는 3 + weekday_dim + hour_dim = 15차원이 된다.
weekday_dim: 7
hour_dim: 5

# --- ablation 스위치 (기본값 = full, 아무것도 끄지 않은 모델) ---
# ablation은 "0-치환" 방식이다 — 모듈을 없애지 않고 항상 생성·실행한 뒤 결과 텐서만 0으로
# 바꾼다. 예외는 use_branch_attention으로, 어텐션은 출력이 아니라 선택 메커니즘이라
# 0-치환이 성립하지 않아 균등 가중으로 대체한다.
# CLI 오버라이드 예: python train.py --config-name config_porto model.use_retrieval=false
use_daily: true
use_weekly: true
use_retrieval: true
use_weather: true
# 'concat'(기본, 정규화 3값을 세 LSTM 입력에 붙임) | 'cls_add'(ir-weather 방식, CLS에 더함)
weather_injection: concat
use_calendar: true
use_branch_attention: true
use_neighbors: true
use_softplus: true

# --- 노드별 gated LSTM weight offset + 공유 weight FP8 ---
# 적응 노드의 유효 weight를 s*W_shared + (1-s)*ΔW로 바꾼다. s와 ΔW 모두 학습 대상이고
# s=1 / ΔW=0에서 출발하므로 학습 시작 시점의 함수는 공유 LSTM과 정확히 같다.
# 설계는 configs/model/merged_ulsan.yaml 주석과 docs/MERGED_ARCHITECTURE.md 참고.
# ulsan과 같은 채택 설정을 porto에서도 기본값으로 쓴다 — porto 자체 대조 근거는 아직
# 없으므로(docs/ADFORMER_REFERENCE_RESULTS.md의 표 5는 두 스위치를 끈 런이다),
# 기준선과 비교하려면 model.node_adaptive=false model.shared_weight_fp8=false로 끈다.
#
# 주의: zero_node_max_demand와는 노드 축이 어긋나 동시에 켤 수 없다(modeling.py가 막는다).
node_adaptive: true
# ΔW를 받을 노드: train 구간 평균 수요가 이 값을 넘는 노드만. porto(10x20=200노드) 기준
# 0.7/0.15 분할에서 52/200 (26.0%)이고 ΔW는 1,903,616개다. 수요가 거의 0인 노드에 노드당
# 36,608개 파라미터를 주면 신호가 아니라 노이즈를 외울 용량만 늘어난다.
# 실제 노드 id 목록(node_adaptive_indices)은 train.py가 train 구간에서 계산해 주입한다.
node_adaptive_min_demand: 0.8
# 공유 temporal LSTM weight/bias 4개를 absmax scaling + torch.float8_e4m3fn으로 fake
# quantize한다(straight-through). ΔW와 s는 fp32로 남고 master weight/연산도 fp32라
# **정확도 실험이지 메모리/속도 절감이 아니다**.
shared_weight_fp8: true

# 'combined'(저장소 공용 CombinedLoss, 다른 모든 브랜치와 동일한 목적함수) |
# 'mae'(merged_model이 원래 쓰던 raw 스케일 L1) |
# 'rmse_mape'(rmse_weight*RMSE + MAPE(+1)).
# train 구간 평균 수요가 이 값 이하인 노드는 학습에서 제외한다 — 예측을 정확히 0으로 고정하고
# 손실에서도 뺀다. null이면 이 기능이 없던 때와 동일하다. **평가는 항상 전체 노드로 한다**
# (평가 대상을 바꾸면 기존 결과와 비교가 성립하지 않는다).
zero_node_max_demand: null

loss_type: mae
loss_gamma: 1.0
loss_eps: 0.5
# loss_type='rmse_mape'에서만 쓰인다. 10이면 두 항이 (RMSE 1.12 -> 11.2) vs (MAPE 8.0)로
# 비슷한 크기가 된다.
rmse_weight: 10.0

# loss_type='demand_split'에서만 쓰인다. 수요가 낮은 셀과 높은 셀에 서로 다른 오차를 준다:
#   실제 수요 <= split_threshold : |오차| / (|y|+1)              <- MAPE(+1)이 보는 것
#   실제 수요 >  split_threshold : split_high_weight * 오차^2    <- RMSE가 보는 것
# rmse_mape(선형 결합)는 모든 셀이 두 항에 동시에 기여해서 "예측을 전반적으로 쪼그라뜨려
# 0셀 MAPE를 벌고 고수요 셀 RMSE를 잃는" 거래가 이득이 된다. 셀을 한 항에만 넣어 그 교차
# 압력을 없앤 것이 이 손실이다. 근거와 w 선택 기준은 models/losses.py의 DemandSplitLoss 참고.
split_threshold: 1.0
split_high_weight: 1.0
