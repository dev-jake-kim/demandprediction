# Porto merged 모델 설정.
# height/width/time_step/retrieval_grid_path/retrieval_train_end/temperature_min/temperature_max/precipitation_max는 train.py가 데이터에서 채운다.

local_radius: 1
d_model: 64
num_fourier_bands: 8
transformer_layers: 2
transformer_heads: 4
transformer_ffn: 128
history_hidden: 64
periodic_hidden: 64
fusion_dim: 128
dropout: 0.10

attention_dropout: 0.0
retrieval_k: 20
retrieval_chunk_size: 256
# 학습(train 모드)에서 [t, t+72h] 후보를 가린다. 평가(eval 모드)는 t 이전만 후보다.
retrieval_future_mask_hours: 72
# 날씨 특성은 임베딩 없이 3개 채널로 주입한다.
weekday_dim: 7
hour_dim: 5

# 모델 ablation 스위치.
use_daily: true
use_weekly: true
use_retrieval: false
use_weather: true
# weather_injection은 날씨 특성의 주입 위치를 선택한다.
weather_injection: concat
use_calendar: true
use_branch_attention: true
use_neighbors: true
use_softplus: true

# node_adaptive는 stage 1에서 ΔW를 고정하고 stage 2에서 학습한다.
node_adaptive: true
node_adaptive_min_demand: 0.1


loss_type: mae
loss_gamma: 1.0
loss_eps: 0.5
# rmse_weight는 loss_type='rmse_mape'에서만 사용한다.
rmse_weight: 10.0

# split_*은 loss_type='demand_split'에서만 사용한다.
split_threshold: 1.0
split_high_weight: 1.0
