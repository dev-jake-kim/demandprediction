# merged 모델(train.py) — ulsan 루트 설정. porto는 configs/config_porto.yaml 참고
# (python train.py --config-name config_porto). 이 브랜치(tmp)의 유일한 모델이라 다른
# model:/train.py는 없다(models/config.py, models/modeling.py 부재 — models/__init__.py 참고).
#
# train: 블록의 값은 전부 원본 merged_model/train.py + merged_model/config.yaml의
# training: 블록에서 그대로 가져온 것이다. TrainingArguments의 기본값과 다른 항목
# (max_grad_norm, lr_scheduler_type, warmup_ratio, batch_size, num_workers, torch_compile,
# metric_for_best_model)은 원본 수동 학습 루프와 정확히 일치시키기 위해 명시한다.
defaults:
  - dataset: ulsan
  - model: merged_ulsan
  - _self_

project_name: test_ulsan
seed: 2026
device: cuda

# 이 모델은 다른 데이터셋 사용자와 다른 분할 비율(0.80/0.10/0.10)을 쓴다.
# configs/dataset/*.yaml의 기본값(0.7/0.15)을 여기서 로컬 오버라이드한다.
dataset:
  train_ratio: 0.80
  val_ratio: 0.10

# UnifiedDemandDataset의 daily/weekly lag 구성. 원본 merged_model/config.yaml의 data: 블록.
# time_step은 configs/dataset/*.yaml의 것을 쓴다.
data:
  daily_period: 24
  daily_lags: 6
  weekly_period: 168
  weekly_lags: 4
  lag_radius: 0

train:
  # 원본: batch_size 8, num_workers 0
  per_device_train_batch_size: 24
  per_device_eval_batch_size: 24
  dataloader_num_workers: 0
  # 원본은 torch.compile을 쓰지 않는다.
  torch_compile: false
  disable_tqdm: true
  # 원본: epochs 2000 / patience 20 (min_epochs 없음 -> callbacks.early_stopping.min_epochs: 0)
  num_train_epochs: 2000
  remove_unused_columns: false
  save_strategy: epoch
  save_total_limit: 1
  # 원본: torch.optim.AdamW(lr, weight_decay). betas/eps는 TrainingArguments 기본값과 동일.
  optim: adamw_torch
  learning_rate: 1e-3
  weight_decay: 1e-4
  # 원본에는 LR 스케줄러도 warmup도 없다(고정 lr). TrainingArguments 기본값은 linear+warmup이라
  # 반드시 덮어써야 한다.
  lr_scheduler_type: constant
  warmup_ratio: 0.0
  # 원본: clip_grad_norm_(max_norm=5.0). TrainingArguments 기본값은 1.0.
  max_grad_norm: 5.0
  # 원본은 epoch마다 train/val 지표를 한 줄씩 남겼다. 결과 JSON의 history를 같은 모양으로
  # 유지하려면 step 단위가 아니라 epoch 단위로 로깅해야 한다.
  logging_strategy: epoch
  eval_strategy: epoch
  load_best_model_at_end: true
  # 원본: val loss(학습에 쓴 손실 자체) 최솟값으로 best 선택.
  metric_for_best_model: loss
  greater_is_better: false
  seed: ${seed}
  full_determinism: false

callbacks:
  early_stopping:
    # patience만 만지는 것보다 min_epochs를 함께 쓰는 쪽이 낫다. 기록을 보면 best 갱신 직전의
    # 긴 무개선 구간(G>=6)이 전 구간에 흩어져 있지 않고 **epoch 12~17에 몰려 있다**.
    # 그 구간은 min_epochs로 통째로 건너뛰고, 그 뒤 수렴 국면에만 작은 patience를 세면
    # 같은 결과를 더 적은 epoch로 얻는다.
    min_epochs: 13
    # 원본 merged_model은 min_epochs 없이 patience=20이었다.
    #
    # 이 값은 모듈 ablation을 제외한 baseline/lora/tmp 세 갈래의 ulsan 학습 기록 37건을
    # (min_epochs, patience) 격자로 시뮬레이션해서 고른 것이다. 판정 기준은
    # "37건 전부 best_epoch가 원본(min=0, patience=20)과 동일할 것"이다.
    #
    #   min=0  pat=20  (원본)   총 1028 epoch            여유 10
    #   min=0  pat=10           총  748 epoch (-27.2%)   여유  0
    #   min=13 pat=5            총  657 epoch (-36.1%)   여유  0
    #   min=13 pat=6            총  685 epoch (-33.4%)   여유  1
    #   min=13 pat=8  <- 채택   총  741 epoch (-27.9%)   여유  3
    #
    # "여유"는 patience를 더 줄여도 결과가 안 깨지는 칸 수다. pat=10(여유 0)은 기록에
    # 딱 붙은 값이라 한 epoch만 더 정체하는 새 런이 나오면 바로 깨진다. min=13과 함께 쓰면
    # 같은 절감폭에서 여유를 3까지 벌 수 있어 이쪽을 택했다.
    #
    # 주의: 관측된 기록에 대한 보장이다. 새로운 설정(node_adaptive, dropout/batch 변경 등)에서
    # 정체가 더 길어지면 결과가 달라질 수 있다 — 결과가 기존 기록보다 나쁘면 이 값부터 의심할 것.
    # porto는 정체 구간이 epoch 10~28로 넓게 퍼져 있어 이 방식이 통하지 않는다
    # (configs/config_porto.yaml 참고).
    early_stopping_patience: 8

# 기존 도구(run_ablation.sh / run_seeds.sh / ABLATION_RESULTS.md) 호환용 요약 JSON.
# ablation은 파일 이름과 JSON 메타데이터에만 쓰이는 라벨이다 — 실제 스위치는 model.use_* 이다.
ablation: full
# smoke 테스트용: 각 split의 앞 N개 샘플만 쓴다(원본 --max-batches에 대응). null이면 전체.
limit_samples: null
# null이면 output/${project_name}/runs/<city>_<loss_type>_<ablation>_seed<seed>.json 에 쓴다.
run_json: null

hydra:
  run:
    dir: output/${project_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: output/${project_name}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
