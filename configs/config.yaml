defaults:
  - dataset: ulsan
  - model: baseline
  - _self_

project_name: baseline
seed: 42
device: cuda

train:
  # 노드별 backprop을 없애고 한 step에 전체 H*W개 노드를 같이 예측하도록 바꾸면서
  # step당 연산량이 H*W배(ulsan 168, porto 200) 늘어남 -> batch size를 크게 낮춤.
  # 실제 GPU 메모리에 맞춰 조정 필요.
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 8
  dataloader_num_workers: 4
  torch_compile: true
  disable_tqdm: true
  num_train_epochs: 80
  remove_unused_columns: false
  save_strategy: epoch
  save_total_limit: 1
  optim: adamw_torch
  learning_rate: 5e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  logging_steps: 500
  eval_strategy: epoch

  load_best_model_at_end: true
  metric_for_best_model: loss
  greater_is_better: false
  seed: ${seed}
  full_determinism: false

callbacks:
  early_stopping:
    min_epochs: 20
    early_stopping_patience: 3

hydra:
  run:
    dir: output/${project_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: output/${project_name}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
