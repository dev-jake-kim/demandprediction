defaults:
  - dataset: ulsan
  - model: adformer
  - _self_

project_name: adformer
seed: 42
device: cuda

train:
  # ADFormer는 매 layer마다 N x N(전 지역) dense attention을 여러 번(SDA/SCA/TSA/TAA) 돌아서
  # baseline(all-node, 로컬 윈도우)보다 step당 메모리 사용량이 큼 -> 보수적으로 시작.
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 16
  dataloader_num_workers: 4
  torch_compile: false  # ADFormer는 SDPA + 커스텀 einsum/matmul이 많아 우선 eager로 검증
  disable_tqdm: false
  num_train_epochs: 80
  remove_unused_columns: false
  save_strategy: epoch
  save_total_limit: 1
  optim: adamw_torch
  learning_rate: 5e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  logging_steps: 500
  eval_strategy: epoch

  load_best_model_at_end: true
  metric_for_best_model: loss
  greater_is_better: false
  seed: ${seed}
  full_determinism: false

callbacks:
  early_stopping:
    min_epochs: 20
    early_stopping_patience: 3

hydra:
  run:
    dir: output/${project_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: output/${project_name}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
