defaults:
  - dataset: ulsan
  - model: dmvst
  - _self_

project_name: dmvst
seed: 42
device: cuda

train:
  # DMVST-Net은 한 step에 H*W개 노드를 전부 배치로 묶어 Local CNN(필터 4개, STResnet의 64개보다
  # 훨씬 가벼움) + LSTM으로 처리 -> baseline(Transformer 인코더)보다는 가볍지만 STResnet(순수 conv,
  # attention 없음)보다는 무거움 -> 중간값으로 시작, 실측 후 조정.
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 16
  dataloader_num_workers: 4
  torch_compile: false
  disable_tqdm: true
  num_train_epochs: 80
  remove_unused_columns: false
  save_strategy: epoch
  save_total_limit: 1
  optim: adamw_torch
  learning_rate: 5e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  logging_steps: 500
  eval_strategy: epoch

  load_best_model_at_end: true
  metric_for_best_model: loss
  greater_is_better: false
  seed: ${seed}
  full_determinism: false

callbacks:
  early_stopping:
    min_epochs: 20
    early_stopping_patience: 3

hydra:
  run:
    dir: output/${project_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: output/${project_name}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
