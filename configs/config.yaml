defaults:
  - dataset: ulsan
  - model: stresnet
  - _self_

project_name: stresnet
seed: 42
device: cuda

train:
  # ST-ResNet은 로컬 3x3 conv(+padding으로 해상도 유지)라 ADFormer(전역 N x N attention)보다
  # 훨씬 가벼움 -> baseline/ADFormer보다 큰 배치로 시작, 실측 후 조정.
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 64
  dataloader_num_workers: 4
  torch_compile: false
  disable_tqdm: true
  num_train_epochs: 80
  remove_unused_columns: false
  save_strategy: epoch
  save_total_limit: 1
  optim: adamw_torch
  learning_rate: 5e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  logging_steps: 500
  eval_strategy: epoch

  load_best_model_at_end: true
  metric_for_best_model: loss
  greater_is_better: false
  seed: ${seed}
  full_determinism: false

callbacks:
  early_stopping:
    min_epochs: 20
    early_stopping_patience: 3

hydra:
  run:
    dir: output/${project_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: output/${project_name}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
