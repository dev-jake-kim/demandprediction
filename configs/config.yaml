defaults:
  - dataset: ulsan
  - model: baseline
  - _self_

project_name: baseline
seed: 42
device: cuda

train:
  # 노드별 backprop을 없애고 한 step에 전체 H*W개 노드를 같이 예측하도록 바꾸면서
  # step당 연산량이 H*W배(ulsan 168, porto 200) 늘어남 -> batch size를 크게 낮춤.
  # 실제 GPU 메모리에 맞춰 조정 필요.
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  dataloader_num_workers: 4
  torch_compile: true
  disable_tqdm: true
  num_train_epochs: 80
  remove_unused_columns: false
  save_strategy: epoch
  save_total_limit: 1
  optim: adamw_torch
  learning_rate: 5e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  logging_steps: 500
  eval_strategy: epoch

  load_best_model_at_end: true
  metric_for_best_model: loss
  greater_is_better: false
  seed: ${seed}
  full_determinism: false

# 2-stage 학습의 stage 2(offset 제한 해제 후 finetuning) 전용 설정.
# 나머지는 train 블록을 그대로 재사용한다. model.node_adaptive=false면 쓰이지 않는다.
stage2:
  # stage 1의 1/5. 수렴한 공유 가중치에서 크게 이탈하지 않으면서 offset이 움직일 여지는 준다.
  learning_rate: 1e-4
  # 'combined'(stage 1과 동일한 CombinedLoss) 또는 'rmse_mape'(rmse_weight*RMSE + MAPE(+1)).
  # rmse_mape의 두 항은 models/metrics.py의 보고 지표와 같은 식이라 최적화 대상과 평가가 일치한다.
  loss: rmse_mape
  rmse_weight: 10.0
  # stage 1을 새로 학습하지 않고 이 체크포인트의 가중치에서 새 stage 2를 시작한다.
  # optimizer/scheduler/global step을 복구하는 중단 재개(resume)가 아니다.
  # checkpoint의 node delta는 모두 0이어야 한다(null이면 stage 1부터 학습).
  # 도시마다 체크포인트가 다르므로 -m 멀티런 대신 도시별로 따로 지정해야 한다.
  init_from: null

callbacks:
  early_stopping:
    min_epochs: 20
    early_stopping_patience: 3

hydra:
  run:
    dir: output/${project_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: output/${project_name}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
