# Porto merged 모델 루트 설정.
defaults:
  - dataset: porto
  - model: merged_porto
  - _self_

project_name: merged
seed: 2026
device: cuda


dataset:
  train_ratio: 0.70
  val_ratio: 0.15

# time_step은 dataset 설정에서 읽는다.
data:
  daily_period: 24
  daily_lags: 6
  weekly_period: 168
  weekly_lags: 4
  lag_radius: 0

train:

  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  # batch 준비·pinning을 worker 프로세스에서 한다(샘플 순서는 main의 sampler가 정한다).
  dataloader_num_workers: 4
  dataloader_persistent_workers: true

  torch_compile: false
  disable_tqdm: true

  num_train_epochs: 120
  remove_unused_columns: false
  save_strategy: epoch
  save_total_limit: 1
  # epoch 체크포인트는 가중치만 저장한다(학습 재개 없음, stage2.init_from은 가중치만 사용).
  save_only_model: true
  # batch를 GPU로 비동기 복사한다(pinned memory). 계산 결과는 같다.
  accelerator_config:
    non_blocking: true

  # 같은 AdamW 식을 단일 fused kernel로 계산한다.
  optim: adamw_torch_fused
  learning_rate: 1e-3
  weight_decay: 0.05
  # optimizer_schedule이 실제 epoch 스케줄을 정의한다.
  lr_scheduler_type: constant
  warmup_ratio: 0.0

  max_grad_norm: 5.0

  logging_strategy: epoch
  # 스텝마다 loss의 NaN/Inf를 검사하는 GPU 동기화를 하지 않는다(로그 집계에만 영향).
  logging_nan_inf_filter: false
  eval_strategy: epoch
  load_best_model_at_end: true

  metric_for_best_model: loss
  greater_is_better: false
  seed: ${seed}
  full_determinism: false

optimizer_schedule:
  name: warmup_cosine
  warmup_epochs: 5
  warmup_lr_init: 1.0e-06
  cosine_epochs: 60
  eta_min: 0.0001

# stage2는 node_adaptive 가중치 해제 후 적용한다.
# init_from은 도시별 체크포인트를 지정한다.
stage2:

  learning_rate: 1e-4

  loss: mae
  rmse_weight: 10.0
  # init_from은 optimizer 상태 없이 가중치만 이어받는다.
  # null이면 stage 1부터 학습한다.
  init_from: null

callbacks:

  early_stopping:
    min_epochs: 0
    early_stopping_patience: 20

# 실험 설명(필수). 학습 로그 맨 위에 커밋 해시와 함께 출력된다.
description: ???
# 실행 설정 라벨(모델 스위치가 아님).
ablation: full
# limit_samples는 각 split에서 사용할 앞쪽 샘플 수이며 null이면 전체다.
limit_samples: null
# null이면 output/${project_name}/runs/<city>_<loss_type>_<ablation>_seed<seed>.json 에 쓴다.
run_json: null

hydra:
  run:
    dir: output/${project_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: output/${project_name}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
