# merged 모델(train.py) — porto 루트 설정. ulsan은 configs/config_ulsan.yaml 참고
# (기본값, --config-name 생략). 이 브랜치(tmp)의 유일한 모델이라 다른 model:/train.py는 없다
# (models/config.py, models/modeling.py 부재 — models/__init__.py 참고).
#
# train: 블록의 값은 전부 원본 merged_model/train.py + merged_model/config.yaml의
# training: 블록에서 그대로 가져온 것이다. TrainingArguments의 기본값과 다른 항목
# (max_grad_norm, lr_scheduler_type, warmup_ratio, batch_size, num_workers, torch_compile,
# metric_for_best_model)은 원본 수동 학습 루프와 정확히 일치시키기 위해 명시한다.
defaults:
  - dataset: porto
  - model: merged_porto
  - _self_

project_name: test_porto
seed: 2026
device: cuda

# ADFormer 기준표(docs/ADFORMER_REFERENCE_RESULTS.md)와 같은 test 구간을 쓰려고
# configs/dataset/*.yaml의 기본값(0.7/0.15)을 그대로 쓴다. 이 모델은 예전에 0.80/0.10을
# 썼고, 그때 기록은 test 구간이 달라 지금 기록과 직접 비교할 수 없다.

# UnifiedDemandDataset의 daily/weekly lag 구성. 원본 merged_model/config.yaml의 data: 블록.
# time_step은 configs/dataset/*.yaml의 것을 쓴다.
data:
  daily_period: 24
  daily_lags: 6
  weekly_period: 168
  weekly_lags: 4
  lag_radius: 0

train:
  # 이전에는 4였다. porto를 19x20=380노드로 잘못 알고 있을 때 SDPA 한계
  # (batch*time_step*nodes <= 65535)를 넘지 않으려고 낮춘 값이다.
  # 정본 격자는 10x20=200노드라 8*24*200=38,400으로 한계에서 멀고, 포팅 전 merged_model도
  # 원래 8을 썼다. ulsan과 같은 값이 되어 두 도시 비교의 교란 요인도 사라진다.
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  dataloader_num_workers: 0
  # 원본은 torch.compile을 쓰지 않는다.
  torch_compile: false
  disable_tqdm: true
  # ADFormer와 같은 학습 길이. LR 스케줄(optimizer_schedule)이 120 epoch를 전제로 한다.
  num_train_epochs: 120
  remove_unused_columns: false
  save_strategy: epoch
  save_total_limit: 1
  # 원본: torch.optim.AdamW(lr, weight_decay). betas/eps는 TrainingArguments 기본값과 동일.
  optim: adamw_torch
  learning_rate: 1e-3
  weight_decay: 0.05
  # LR은 optimizer_schedule(WarmupCosineAnnealingLR)이 만든다. 아래 두 값은 그 경로에서
  # 쓰이지 않지만, optimizer_schedule.name=null로 되돌렸을 때의 기본값으로 남겨 둔다.
  lr_scheduler_type: constant
  warmup_ratio: 0.0
  # 원본: clip_grad_norm_(max_norm=5.0). TrainingArguments 기본값은 1.0.
  max_grad_norm: 5.0
  # 원본은 epoch마다 train/val 지표를 한 줄씩 남겼다. 결과 JSON의 history를 같은 모양으로
  # 유지하려면 step 단위가 아니라 epoch 단위로 로깅해야 한다.
  logging_strategy: epoch
  eval_strategy: epoch
  load_best_model_at_end: true
  # 원본: val loss(학습에 쓴 손실 자체) 최솟값으로 best 선택.
  metric_for_best_model: loss
  greater_is_better: false
  seed: ${seed}
  full_determinism: false

# configs/config_ulsan.yaml의 같은 블록 주석 참고. name: null이면 지금까지와 동일하게
# train.lr_scheduler_type을 쓴다.
optimizer_schedule:
  name: warmup_cosine
  warmup_epochs: 5
  warmup_lr_init: 1e-6
  cosine_epochs: 60
  eta_min: 1e-4

callbacks:
  early_stopping:
    # 120 epoch를 끝까지 돌린다 — cosine 감쇠 뒤 eta_min 구간까지 스케줄을 다 태워야
    # ADFormer와 같은 조건이 된다. best 체크포인트는 load_best_model_at_end가 고른다.
    min_epochs: 0
    early_stopping_patience: 10

# 기존 도구(run_ablation.sh / run_seeds.sh / ABLATION_RESULTS.md) 호환용 요약 JSON.
# ablation은 파일 이름과 JSON 메타데이터에만 쓰이는 라벨이다 — 실제 스위치는 model.use_* 이다.
ablation: full
# smoke 테스트용: 각 split의 앞 N개 샘플만 쓴다(원본 --max-batches에 대응). null이면 전체.
limit_samples: null
# null이면 output/${project_name}/runs/<city>_<loss>_<ablation>[_<periodic_mode>][_nodeadaptive]_seed<seed>.json.
run_json: null

hydra:
  run:
    dir: output/${project_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: output/${project_name}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
